<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>For You 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff5f8;
    }
    h1 {
      color: #ff4d88;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 40px);
      gap: 5px;
      justify-content: center;
      margin-top: 20px;
    }
    .cell {
      width: 40px;
      height: 40px;
      background: white;
      border: 2px solid #ffb6c1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
    .selected {
      background: #ffd6e7;
    }
    .found {
      background: #ff4d88;
      color: white;
    }
    #message {
      margin-top: 20px;
      font-size: 20px;
      color: #ff4d88;
      display: none;
    }
  </style>
</head>
<body>

<h1>Find the Hidden Word 💕</h1>
<p>(Hint: it's something I feel about you)</p>

<div class="grid" id="grid"></div>

<div id="message">You found it 💖 I love you.</div>

<script>
  const word = "LOVE";
  const gridSize = 10;

  let grid = [];
  let selected = [];

  function createGrid() {
    const gridElement = document.getElementById("grid");

    // Fill grid with random letters
    for (let i = 0; i < gridSize; i++) {
      grid[i] = [];
      for (let j = 0; j < gridSize; j++) {
        const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
        grid[i][j] = letter;
      }
    }

    // Place the word horizontally
    const row = Math.floor(Math.random() * gridSize);
    const col = Math.floor(Math.random() * (gridSize - word.length));

    for (let i = 0; i < word.length; i++) {
      grid[row][col + i] = word[i];
    }

    // Render grid
    gridElement.innerHTML = "";
    for (let i = 0; i < gridSize; i++) {
      for (let j = 0; j < gridSize; j++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.textContent = grid[i][j];
        cell.dataset.row = i;
        cell.dataset.col = j;

        cell.addEventListener("click", () => selectCell(cell));

        gridElement.appendChild(cell);
      }
    }
  }

  function selectCell(cell) {
    cell.classList.toggle("selected");

    selected = Array.from(document.querySelectorAll(".selected"))
      .map(c => c.textContent)
      .join("");

    if (selected.includes(word)) {
      document.querySelectorAll(".selected").forEach(c => {
        c.classList.remove("selected");
        c.classList.add("found");
      });
      document.getElementById("message").style.display = "block";
    }
  }

  createGrid();
</script>

</body>
</html>
