<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sweetpuss Word Search 💖</title>

<style>
body {
  text-align: center;
  font-family: Arial, sans-serif;
  background: #fff5f8;
  margin: 0;
  padding: 20px;
}

h1 {
  color: #ff4d88;
  font-size: 28px;
  margin-bottom: 10px;
}

p {
  font-size: 18px;
}

#container {
  position: relative;
  display: inline-block;
  margin-top: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(15, 32px);
  gap: 6px;
}

.cell {
  width: 32px;
  height: 32px;
  font-size: 20px;
  color: black;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  cursor: pointer;
  font-weight: 500;
}

.found {
  color: #ff4d88;
  font-weight: bold;
}

#overlay {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
}

#message {
  margin-top: 22px;
  font-size: 22px;
  color: #ff4d88;
  display: none;
}

#wordList {
  max-width: 560px;
  margin: 20px auto 0;
  font-size: 14px;
  line-height: 1.8;
  color: black;
}

.wordItem {
  margin: 0 10px;
  white-space: nowrap;
}

.wordFound {
  color: #ff4d88;
  font-weight: bold;
  text-decoration: line-through;
}
</style>
</head>

<body>

<h1>Sweetpuss Word Search</h1>
<p>Drag across the letters...</p>

<div id="container">
  <div class="grid" id="grid"></div>
  <canvas id="overlay"></canvas>
</div>

<div id="wordList"></div>

<div id="message">You found them all 💖</div>

<script>
const puzzle = [
  "QIQZHREDNEKSIGV",
  "SNSUIOPVUWZLCKR",
  "TDPSSSUPTEEWSEU",
  "KGHAXTIDWHLZBFO",
  "KSNBDZAEWHBMSUC",
  "RTTVCADTUGETSDT",
  "MCLIDBTANVGFWDO",
  "PGXZMBVAOERNTDB",
  "ICHCUMJNLNKFBQE",
  "OBTDWMIAGILCXPR",
  "SFWVGYBNZZVFIFK",
  "QIDTOVFAGZPVNHS",
  "QJULMVIERWIAOXC",
  "CLASAGNAKXBPRIE",
  "ANIUQSEALHYPLTJ"
];

const words = [
  "SWEETPUSS",
  "STIMMING",
  "NOVEMBER",
  "OCTOBER",
  "LASAGNA",
  "CHICKENTATSU",
  "PIZZA",
  "ISKENDER",
  "LAESQUINA"
];

const size = puzzle.length;
let grid = puzzle.map(row => row.split(""));
let foundWords = new Set();

let startCell = null;
let currentCell = null;
let isDragging = false;

const gridEl = document.getElementById("grid");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const wordListEl = document.getElementById("wordList");

function resizeCanvas() {
  canvas.width = gridEl.offsetWidth;
  canvas.height = gridEl.offsetHeight;
}

function createWordList() {
  wordListEl.innerHTML = words.map((word, index) => {
    return `<span class="wordItem" id="word-${word}">${index + 1}. ${word.toLowerCase()}</span>`;
  }).join("");
}

function createGrid() {
  gridEl.innerHTML = "";

  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = grid[r][c];
      cell.dataset.row = r;
      cell.dataset.col = c;

      cell.addEventListener("mousedown", startDrag);
      cell.addEventListener("mouseenter", dragOver);

      gridEl.appendChild(cell);
    }
  }

  resizeCanvas();
}

function getCellCenter(cell) {
  const rect = cell.getBoundingClientRect();
  const parentRect = gridEl.getBoundingClientRect();

  return {
    x: rect.left - parentRect.left + rect.width / 2,
    y: rect.top - parentRect.top + rect.height / 2
  };
}

function drawOval(startCell, endCell) {
  const start = getCellCenter(startCell);
  const end = getCellCenter(endCell);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = (start.x + end.x) / 2;
  const cy = (start.y + end.y) / 2;
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const length = Math.sqrt(dx * dx + dy * dy);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(Math.atan2(dy, dx));

  ctx.beginPath();
  ctx.ellipse(0, 0, length / 2 + 18, 20, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 77, 136, 0.25)";
  ctx.fill();

  ctx.restore();
}

function startDrag(e) {
  startCell = e.target;
  currentCell = e.target;
  isDragging = true;
  drawOval(startCell, currentCell);
}

function dragOver(e) {
  if (!isDragging || !startCell) return;

  currentCell = e.target;
  drawOval(startCell, currentCell);
}

function endDrag() {
  if (!isDragging || !startCell || !currentCell) return;

  isDragging = false;

  const startRow = parseInt(startCell.dataset.row);
  const startCol = parseInt(startCell.dataset.col);
  const endRow = parseInt(currentCell.dataset.row);
  const endCol = parseInt(currentCell.dataset.col);

  const rowDiff = endRow - startRow;
  const colDiff = endCol - startCol;

  const isHorizontal = rowDiff === 0;
  const isVertical = colDiff === 0;
  const isDiagonal = Math.abs(rowDiff) === Math.abs(colDiff);

  if (!isHorizontal && !isVertical && !isDiagonal) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    startCell = null;
    currentCell = null;
    return;
  }

  const dRow = Math.sign(rowDiff);
  const dCol = Math.sign(colDiff);

  let letters = [];
  let selectedCells = [];

  let r = startRow;
  let c = startCol;

  while (true) {
    letters.push(grid[r][c]);

    const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
    selectedCells.push(cell);

    if (r === endRow && c === endCol) break;

    r += dRow;
    c += dCol;
  }

  const selectedWord = letters.join("");
  const reversedWord = selectedWord.split("").reverse().join("");

  const matchedWord = words.find(word => word === selectedWord || word === reversedWord);

  if (matchedWord && !foundWords.has(matchedWord)) {
    foundWords.add(matchedWord);

    selectedCells.forEach(cell => {
      cell.classList.add("found");
    });

    const wordItem = document.getElementById(`word-${matchedWord}`);
    if (wordItem) {
      wordItem.classList.add("wordFound");
    }

    if (foundWords.size === words.length) {
      document.getElementById("message").style.display = "block";
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  startCell = null;
  currentCell = null;
}

document.addEventListener("mouseup", endDrag);
window.addEventListener("resize", resizeCanvas);

createWordList();
createGrid();
</script>

</body>
</html>
